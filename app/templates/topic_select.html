<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bush Teaching Assistant - WAEC Past Questions & Customized Tests for Ghanaian SHS Students">
    <meta name="author" content="Emmanuel Asiamah Amponsah">
    <meta name="keywords" content="chemistry, WAEC, past questions, SHS, teaching assistant, Ghana education">

<title>Bush Teaching Assistant!</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: white;
}

header {
  text-align: center;
  padding: 40px 20px 10px;
}

header h1 {
  font-size: 2.8rem;
  background: linear-gradient(to right, #00ffea, #ff00cc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  border-color: #00ffea;
}

.card h3 {
  color: #00ffea;
}

  /* NAV */
        .nav-links {
            text-align: center;
            margin: 45px 0 25px;
        }

        .nav-links a {
            display: inline-block;
            padding: 12px 28px;
            margin: 8px;
            text-decoration: none;
            color: white;
            font-size: 0.95rem;
            border-radius: 30px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(59,130,246,0.5);
        }

        .nav-links a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(59,130,246,0.7);
        }


footer {
  text-align: center;
  padding: 20px;
  opacity: 0.7;
}



        /* LOGOUT */
         .logout {
              margin-top: 20px;    
              text-align: center;
         }

         .logout a {
             color: #dc3545;
             text-decoration: none;
             font-weight: bold;
         }

          .logout a:hover {
             text-decoration: underline;
         }


</style>
</head>

<body>

<div class="header">
    <h2 style="text-align:center;">Hi, {{ user.first_name }} 👋</h2>
</div>

<div class="logout">
    <a href="{{ url_for('auth.logout') }}">Logout</a>
</div>

<header>
    <h1>{{ subject }} Topics</h1>
    <p>Select a topic to practise BTA Quiz</p>
</header>

<div class="container">

    {% for topic in topics %}

    <div class="card" onclick="startQuiz('{{ topic }}')">
        <h3>{{ topic }}</h3>
    </div>

    {% endfor %}

</div>

<div class="nav-links">
    <a href="{{ url_for('dashboard.subject_select') }}">← Change subject</a>
    <a href="{{ url_for('dashboard.dashboard') }}">Go to Dashboard</a>
</div>

<footer>
    © 2026 Bush Teaching Assistant
</footer>

<script>
function startQuiz(topic) {
    const cleanTopic = topic.toLowerCase().trim();

    window.location.href =
        `/quiz/{{ subject }}/${encodeURIComponent(cleanTopic)}`;
}
</script>

</body>
</html>
