{% extends "extra_class_teacher_base.html" %}

{% block content %}
<div style="max-width: 760px; margin: 40px auto;">
    <div style="background: #fff; border-radius: 16px; padding: 45px 30px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.08);">
        <div style="font-size: 46px; margin-bottom: 12px;">{{ feature_icon }}</div>
        <h1 style="margin: 0 0 10px; color: #3b0d18;">{{ feature_title }}</h1>
        <p style="margin: 0 auto 24px; max-width: 560px; color: #666; line-height: 1.7;">{{ feature_message }}</p>
        <a href="{{ url_for('extra_class_teacher.teacher_my_class') }}" style="display:inline-block; padding:11px 18px; border-radius:9px; background:#3b0d18; color:#fff; text-decoration:none; font-weight:700;">Back to My Class</a>
    </div>
</div>
{% endblock %}
