<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>{{ topic }} | BTA Practice</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #00ffea;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #ddd;
            font-size: 14px;
        }

        .topic-title {
            color: #ff00cc;
            font-size: 22px;
            margin-top: 12px;
        }

        .session-notice {
            display: none;
            background: rgba(0, 255, 234, 0.12);
            border: 1px solid #00ffea;
            color: #00ffea;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 13px;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 8px;
            color: #ddd;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffea, #ff00cc);
            transition: width 0.3s ease;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .question-number {
            color: #00ffea;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .options button {
            width: 100%;
            text-align: left;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .options button:hover:not(:disabled) {
            border-color: #00ffea;
            background: rgba(0, 255, 234, 0.1);
        }

        .options button:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .options button.selected {
            border-color: #00ffea;
        }

        .options button.correct {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.18);
            color: #00ff9d;
        }

        .options button.wrong {
            border-color: #ff5252;
            background: rgba(255, 82, 82, 0.18);
            color: #ff8585;
        }

        .feedback {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 14px;
        }

        .feedback.correct-feedback {
            display: block;
            background: rgba(0, 230, 118, 0.12);
            border-left: 4px solid #00e676;
        }

        .feedback.wrong-feedback {
            display: block;
            background: rgba(255, 82, 82, 0.12);
            border-left: 4px solid #ff5252;
        }

        .feedback strong {
            display: block;
            margin-bottom: 6px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .nav-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .prev-btn {
            background: #555;
            color: #fff;
        }

        .skip-btn {
            background: #ff00cc;
            color: #fff;
        }

        .next-btn {
            background: #00ffea;
            color: #111;
        }

        .finish-btn {
            background: #00e676;
            color: #111;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #00ffea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            display: none;
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid #ff5252;
            color: #ff9999;
            padding: 18px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .result-box {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #00ffea;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-top: 20px;
        }

        .result-box h2 {
            color: #00ffea;
            margin-bottom: 15px;
        }

        .result-score {
            font-size: 42px;
            color: #00ffea;
            font-weight: 800;
            margin: 15px 0;
        }

        .result-details {
            line-height: 2;
            color: #ddd;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        .footer-links a {
            color: #00ffea;
            text-decoration: none;
            font-size: 13px;
        }

        .footer-links a:hover {
            color: #ff00cc;
        }

        .save-status {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 24px;
            }

            .topic-title {
                font-size: 18px;
            }

            .quiz-card {
                padding: 17px;
            }

            .question-text {
                font-size: 16px;
            }

            .navigation {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .nav-btn {
                width: 100%;
                padding: 12px 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>BTA Practice Quiz</h1>

        <p>
            Welcome, {{ user.first_name }}.
            Test your understanding and improve your performance.
        </p>

        <div class="topic-title">
            {{ subject }} — {{ topic }}
        </div>

    </div>


    <div id="sessionNotice" class="session-notice"></div>


    <div id="loading" class="loading">

        <div class="spinner"></div>

        <p id="loadingMessage">
            Preparing your practice session...
        </p>

    </div>


    <div id="quizArea" style="display:none;">

        <div class="progress-container">

            <div class="progress-info">

                <span id="questionCounter">
                    Question 1 of 50
                </span>

                <span id="answeredCounter">
                    Answered: 0
                </span>

            </div>

            <div class="progress-bar">

                <div id="progressFill" class="progress-fill"></div>

            </div>

        </div>


        <div class="quiz-card">

            <div id="questionNumber" class="question-number"></div>

            <div id="questionText" class="question-text"></div>

            <div id="options" class="options"></div>

            <div id="feedback" class="feedback"></div>

            <div class="navigation">

                <button
                    id="prevBtn"
                    class="nav-btn prev-btn"
                    onclick="previousQuestion()"
                >
                    Previous
                </button>

                <button
                    id="skipBtn"
                    class="nav-btn skip-btn"
                    onclick="skipQuestion()"
                >
                    Skip
                </button>

                <button
                    id="nextBtn"
                    class="nav-btn next-btn"
                    onclick="nextQuestion()"
                >
                    Next
                </button>

                <button
                    id="finishBtn"
                    class="nav-btn finish-btn"
                    onclick="finishQuiz()"
                    style="display:none;"
                >
                    Finish Quiz
                </button>

            </div>

            <div id="saveStatus" class="save-status"></div>

        </div>

    </div>


    <div id="errorBox" class="error-box"></div>


    <div id="resultBox" class="result-box">

        <h2>Practice Completed!</h2>

        <p>Your performance summary</p>

        <div id="resultScore" class="result-score"></div>

        <div id="resultDetails" class="result-details"></div>

    </div>


    <div class="footer-links">

        <a href="{{ url_for('dashboard.dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('dashboard.topic_select', subject=subject) }}">
            Change Topic
        </a>

        <a href="{{ url_for('auth.logout') }}">
            Logout
        </a>

    </div>

</div>


<script>

    // ----------------------------------------------------
    // INITIAL CONFIGURATION
    // ----------------------------------------------------

    const subject = {{ subject|tojson }};
    const topic = {{ topic|tojson }};

    const csrfToken = document.querySelector(
        'meta[name="csrf-token"]'
    ).content;


    // ----------------------------------------------------
    // QUIZ VARIABLES
    // ----------------------------------------------------

    let questions = [];

    let sessionId = null;

    let currentIndex = 0;

    let savedAnswers = {};

    let answerInProgress = false;

    let progressRequest = Promise.resolve();

    let quizCompleted = false;


    // ----------------------------------------------------
    // DOM ELEMENTS
    // ----------------------------------------------------

    const loading = document.getElementById("loading");

    const loadingMessage = document.getElementById(
        "loadingMessage"
    );

    const quizArea = document.getElementById("quizArea");

    const errorBox = document.getElementById("errorBox");

    const sessionNotice = document.getElementById(
        "sessionNotice"
    );


    // ----------------------------------------------------
    // API HELPER
    // ----------------------------------------------------

    async function apiRequest(url, method = "POST", data = {}) {

        const response = await fetch(url, {

            method: method,

            headers: {

                "Content-Type": "application/json",

                "X-CSRFToken": csrfToken

            },

            body: method === "GET"
                ? undefined
                : JSON.stringify(data)

        });


        let result;

        try {

            result = await response.json();

        } catch (error) {

            throw new Error(
                "The server returned an unexpected response."
            );

        }


        if (!response.ok) {

            const error = new Error(
                result.message || "Something went wrong."
            );

            error.status = response.status;

            throw error;

        }

        return result;

    }


    // ----------------------------------------------------
    // START OR RESUME SESSION
    // ----------------------------------------------------

    async function loadQuestions() {

        try {

            loading.style.display = "block";

            loadingMessage.textContent =
                "Checking your previous practice session...";


            const result = await apiRequest(

                `/practice/start/${encodeURIComponent(subject)}/${encodeURIComponent(topic)}`

            );


            if (!result.success) {

                throw new Error(
                    result.message || "Unable to start practice."
                );

            }


            sessionId = result.session_id;

            questions = result.questions || [];

            currentIndex = Number(
                result.current_question_index || 0
            );

            savedAnswers = result.saved_answers || {};


            if (!questions.length) {

                throw new Error(
                    "No questions were returned for this topic."
                );

            }


            if (result.resumed) {

                sessionNotice.textContent =
                    "Your previous practice session has been restored. You can continue where you stopped.";

                sessionNotice.style.display = "block";

            }


            loading.style.display = "none";

            quizArea.style.display = "block";


            renderQuestion();

            updateCounters();


        } catch (error) {

            showError(error.message);

        }

    }


    // ----------------------------------------------------
    // RENDER QUESTION
    // ----------------------------------------------------

    function renderQuestion() {

        if (!questions.length) {
            return;
        }


        const question = questions[currentIndex];

        const questionId = String(question.question_id);


        document.getElementById("questionNumber").textContent =
            `QUESTION ${currentIndex + 1}`;


        document.getElementById("questionText").textContent =
            question.question;


        document.getElementById("questionCounter").textContent =
            `Question ${currentIndex + 1} of ${questions.length}`;


        const optionsContainer = document.getElementById("options");

        optionsContainer.innerHTML = "";


        const feedback = document.getElementById("feedback");

        feedback.className = "feedback";

        feedback.style.display = "none";

        feedback.innerHTML = "";


        const existingAnswer = savedAnswers[questionId];


        const optionLetters = ["A", "B", "C", "D"];


        optionLetters.forEach(letter => {

            const optionText = question.options[letter];

            if (optionText === null || optionText === undefined) {
                return;
            }


            const button = document.createElement("button");

            button.type = "button";

            button.dataset.answer = letter;

            button.textContent =
                `${letter}. ${optionText}`;


            if (existingAnswer) {

                button.disabled = true;

                if (letter === existingAnswer.correct_answer) {

                    button.classList.add("correct");

                }

                if (
                    letter === existingAnswer.selected_answer &&
                    !existingAnswer.is_correct
                ) {

                    button.classList.add("wrong");

                }

                if (
                    letter === existingAnswer.selected_answer &&
                    existingAnswer.is_correct
                ) {

                    button.classList.add("selected");

                }

            } else {

                button.addEventListener("click", function() {

                    selectAnswer(letter);

                });

            }


            optionsContainer.appendChild(button);

        });


        if (existingAnswer) {

            showFeedback(existingAnswer);

        }


        document.getElementById("prevBtn").disabled =
            currentIndex === 0;


        document.getElementById("skipBtn").style.display =
            currentIndex === questions.length - 1
                ? "none"
                : "block";


        document.getElementById("nextBtn").style.display =
            currentIndex === questions.length - 1
                ? "none"
                : "block";


        document.getElementById("finishBtn").style.display =
            currentIndex === questions.length - 1
                ? "block"
                : "none";


        updateCounters();

    }


    // ----------------------------------------------------
    // SUBMIT ANSWER
    // ----------------------------------------------------

    async function selectAnswer(selectedAnswer) {

        if (answerInProgress || quizCompleted) {
            return;
        }


        const question = questions[currentIndex];

        const questionId = String(question.question_id);


        // Prevent answering the same question twice.

        if (savedAnswers[questionId]) {
            return;
        }


        answerInProgress = true;

        document.getElementById("saveStatus").textContent =
            "Saving your answer...";


        const buttons = document.querySelectorAll(
            "#options button"
        );

        buttons.forEach(button => {

            button.disabled = true;

        });


        try {

            const result = await apiRequest(

                `/practice/answer/${sessionId}`,

                "POST",

                {

                    question_id: question.question_id,

                    selected_answer: selectedAnswer

                }

            );


            if (!result.success) {

                throw new Error(
                    result.message || "Unable to save your answer."
                );

            }


            savedAnswers[questionId] = {

                selected_answer: result.selected_answer,

                is_correct: result.is_correct,

                correct_answer: result.correct_answer,

                explanation: result.explanation

            };


            document.getElementById("saveStatus").textContent =
                "Answer saved successfully.";


            renderQuestion();


        } catch (error) {

            document.getElementById("saveStatus").textContent =
                "Your answer could not be confirmed.";


            if (error.status === 410) {

                showError(
                    "Your 24-hour practice session has expired. Please start a new quiz."
                );

            } else {

                showError(error.message);

                buttons.forEach(button => {

                    button.disabled = false;

                });

            }

        } finally {

            answerInProgress = false;

        }

    }


    // ----------------------------------------------------
    // DISPLAY ANSWER FEEDBACK
    // ----------------------------------------------------

    function showFeedback(answer) {

        const feedback = document.getElementById("feedback");

        feedback.style.display = "block";


        if (answer.is_correct) {

            feedback.className =
                "feedback correct-feedback";

            feedback.innerHTML = `

                <strong>Correct Answer!</strong>

                <div>
                    ${escapeHTML(answer.explanation || "Well done!")}
                </div>

            `;

        } else {

            feedback.className =
                "feedback wrong-feedback";

            feedback.innerHTML = `

                <strong>Incorrect Answer</strong>

                <div>
                    Correct answer: ${escapeHTML(answer.correct_answer)}
                </div>

                <div style="margin-top:8px;">
                    ${escapeHTML(answer.explanation || "")}
                </div>

            `;

        }

    }


    // ----------------------------------------------------
    // UPDATE COUNTERS
    // ----------------------------------------------------

    function updateCounters() {

        const answeredCount = Object.keys(savedAnswers).length;

        document.getElementById("answeredCounter").textContent =
            `Answered: ${answeredCount}`;


        const percentage =
            ((currentIndex + 1) / questions.length) * 100;


        document.getElementById("progressFill").style.width =
            `${percentage}%`;

    }


    // ----------------------------------------------------
    // SAVE CURRENT POSITION
    // ----------------------------------------------------

    async function saveProgress(index) {

        if (!sessionId || quizCompleted) {
            return;
        }


        progressRequest = progressRequest.then(async () => {

            await apiRequest(

                `/practice/progress/${sessionId}`,

                "POST",

                {

                    current_question_index: index

                }

            );

        });


        try {

            await progressRequest;

        } catch (error) {

            if (error.status === 410) {

                showError(
                    "Your practice session has expired. Please start a new quiz."
                );

            } else {

                document.getElementById("saveStatus").textContent =
                    "Unable to save your current position. Please check your connection.";

            }

        }

    }


    // ----------------------------------------------------
    // NEXT QUESTION
    // ----------------------------------------------------

    async function nextQuestion() {

        if (currentIndex >= questions.length - 1) {
            return;
        }

        if (answerInProgress) {
            return;
        }


        currentIndex++;

        renderQuestion();

        await saveProgress(currentIndex);

    }


    // ----------------------------------------------------
    // PREVIOUS QUESTION
    // ----------------------------------------------------

    async function previousQuestion() {

        if (currentIndex <= 0 || answerInProgress) {
            return;
        }


        currentIndex--;

        renderQuestion();

        await saveProgress(currentIndex);

    }


    // ----------------------------------------------------
    // SKIP QUESTION
    // ----------------------------------------------------

    async function skipQuestion() {

        if (currentIndex >= questions.length - 1) {
            return;
        }

        if (answerInProgress) {
            return;
        }


        currentIndex++;

        renderQuestion();

        await saveProgress(currentIndex);

    }


    // ----------------------------------------------------
    // COMPLETE QUIZ
    // ----------------------------------------------------

    async function finishQuiz() {

        if (answerInProgress) {

            alert("Please wait while your answer is being saved.");

            return;

        }


        const confirmed = confirm(
            "Are you sure you want to finish this practice quiz?"
        );

        if (!confirmed) {
            return;
        }


        try {

            document.getElementById("finishBtn").disabled = true;

            document.getElementById("saveStatus").textContent =
                "Calculating your results...";


            const result = await apiRequest(

                `/practice/complete/${sessionId}`,

                "POST",

                {}

            );


            if (!result.success) {

                throw new Error(
                    result.message || "Unable to complete quiz."
                );

            }


            quizCompleted = true;

            quizArea.style.display = "none";


            const resultBox = document.getElementById("resultBox");

            resultBox.style.display = "block";


            document.getElementById("resultScore").textContent =
                `${result.accuracy}%`;


            document.getElementById("resultDetails").innerHTML = `

                <p>Total Questions: ${result.total_questions}</p>

                <p>Attempted: ${result.attempted}</p>

                <p>Correct Answers: ${result.correct}</p>

                <p>Incorrect Answers: ${result.incorrect}</p>

                <p>Unanswered: ${result.unanswered}</p>

                <p>Accuracy: ${result.accuracy}%</p>

            `;


        } catch (error) {

            showError(error.message);

            document.getElementById("finishBtn").disabled = false;

        }

    }


    // ----------------------------------------------------
    // ERROR HANDLING
    // ----------------------------------------------------

    function showError(message) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent = message;

    }


    // ----------------------------------------------------
    // HTML ESCAPING
    // ----------------------------------------------------

    function escapeHTML(value) {

        const element = document.createElement("div");

        element.textContent = value || "";

        return element.innerHTML;

    }


    // ----------------------------------------------------
    // START THE QUIZ
    // ----------------------------------------------------

    document.addEventListener("DOMContentLoaded", function() {

        loadQuestions();

    });

</script>

</body>
    </html>
