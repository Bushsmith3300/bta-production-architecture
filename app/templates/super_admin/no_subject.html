<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subject Not Assigned</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            background: white;
            max-width: 550px;
            width: 100%;

            padding: 40px;

            border-radius: 14px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, .08);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            color: #111827;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .admin-name {
            color: #111827;
            font-weight: 700;
        }

        .logout {
            display: inline-block;

            padding: 10px 18px;

            background: #2563eb;
            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: 600;
        }

        .logout:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            ⚠️
        </div>

        <h1>
            Subject Not Assigned
        </h1>

        <p>

            Hello
            <span class="admin-name">
                {{ user.first_name }}
            </span>.

            Your administrator account has not been assigned
            a subject yet.

            Please contact the Super Admin (Bush) to have a subject
            assigned to your account.

        </p>

        <a
            href="{{ url_for('auth.logout') }}"
            class="logout"
        >
            Logout
        </a>

    </div>

</body>

</html>
